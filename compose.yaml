services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pedidos360
      MYSQL_USER: pedidos360
      MYSQL_PASSWORD: pedidos360
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pedidos360_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: pedidos360
      MYSQL_USER: pedidos360
      MYSQL_PASSWORD: pedidos360
      MYSQL_SSL: "false"
      BACKEND_PUBLIC_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:4200
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pedidos360_data:
